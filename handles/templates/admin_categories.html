<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/static/style.css">
        <link rel="icon" href="/static/favicon.png" type="image/png">
        <title>Категории</title>
    </head>

    <body>
        <div class="ball_1"></div>
        <div class="ball_2"></div>

        <nav class="glass">
            <a class="logo" href="/">Thread & Brush</a>
            <a href="/admin/products">Товары</a>
            <a href="/admin/categories">Категории</a>
            <a href="/cart">Корзина</a>
            <span>{{.User.Login}}</span>
            <a href="/logout">Выйти</a>
        </nav>

        <main>
            <h2>Категории</h2>

            <form class="box wide glass" method="post" action="{{if .Edit.Id}}/admin/categories/update/{{.Edit.Id}}{{else}}/admin/categories/create{{end}}">
                <h3>{{if .Edit.Id}}Редактирование категории{{else}}Новая категория{{end}}</h3>

                <label class="field">
                    Название
                    <input name="name" value="{{.Edit.Name}}" required>
                </label>

                <button>Сохранить</button>

                {{if .Edit.Id}}
                    <a class="btn" href="/admin/categories">Отмена</a>
                {{end}}
            </form>

            <br>

            <table class="glass">
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th></th>
                </tr>

                {{range .Categories}}
                    <tr>
                        <td>{{.Id}}</td>
                        <td>{{.Name}}</td>
                        <td>
                            <a class="btn" href="/admin/categories/{{.Id}}">Изменить</a>
                            <form method="post" action="/admin/categories/delete/{{.Id}}">
                                <button class="red">Удалить</button>
                            </form>
                        </td>
                    </tr>
                {{end}}
            </table>
        </main>
    </body>
</html>
